name: notredame
description: The 5th generation of ÉTSMobile, the main gateway between the École de technologie supérieure and its students on mobile devices.

# The following line prevents the package from being accidentally published to
# pub.dev using `pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 5.1.2

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.11.1

  # Architecture
  get_it: ^8.2.0
  provider: ^6.1.5+1
  stacked: ^3.5.0

  # Firebase
  firebase_core: ^5.2.0
  firebase_analytics: ^13.1.0
  firebase_crashlytics: ^6.1.0
  firebase_remote_config: ^7.1.0

  # Web
  url_launcher: ^6.3.3

  # Utils
  logger: ^2.8.0
  fluttertoast: ^10.0.3
  share_plus: ^13.3.1
  github: ^9.26.0
  in_app_review: ^2.0.12
  timeago: ^3.7.1
  device_calendar_plus: ^0.12.0
  collection: ^1.19.1
  intl: ^0.20.3

  # Widgets
  table_calendar: ^3.3.0
  auto_size_text: ^3.0.0
  gpt_markdown: ^1.4.1
  flutter_svg: ^2.5.0
  font_awesome_flutter: ^11.0.0
  calendar_view: ^2.0.0
  reorderable_grid_view: ^2.2.8
  infinite_scroll_pagination: ^5.1.1

  # Animations
  skeletonizer: ^3.0.0
  animations: ^3.0.0

  # Network
  http: ^1.6.0
  flutter_cache_manager: ^3.5.0
  msal_auth: ^3.5.3
  dio: ^5.11.1
  synchronized: ^3.6.1+1
  retry: ^3.1.2
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  retrofit: ^4.10.0
  connectivity_plus: ^7.3.2

  # Storage
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.8.1
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.2
  import_sorter: ^4.6.0
  flutter_lints: ^6.0.0
  json_serializable: ^6.15.2
  freezed: ^4.0.3
  retrofit_generator: ^10.3.3
  http_mock_adapter: ^0.6.1

  listen: any
flutter_icons:
  android: 'launcher_icon'
  ios: 'LaunchImage'
  image_path: 'assets/icons/launcher_icon.png'
  adaptive_icon_background: '#EF3F45'
  adaptive_icon_foreground: 'assets/icons/ic_launcher_foreground.png'

flutter:
  uses-material-design: true
  generate: true

  assets:
    - pubspec.yaml
    - assets/images/
    - assets/markdown/
    - assets/icons/
    - assets/animations/
    - assets/certificates/
    - assets/
